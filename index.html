const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
function orderDebts(debts, strategy) {
  const d = debts.map((x, i) => ({ ...x, idx: i }));

      if (ti >= 0) { const x = Math.min(bal[ti], l.amount); bal[ti] = r2(bal[ti] - x); paid[ti] += x; }

      const x = Math.min(bal[i], pool); if (x > 0) { bal[i] = r2(bal[i] - x); paid[i] += x; pool = r2(pool - x); }
